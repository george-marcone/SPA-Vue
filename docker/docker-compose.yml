services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spa_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    build:
      context: ../Backend_API
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=FormDB;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False
    ports:
      - "5000:80"

  front:
    build:
      context: ../ESCOLA_FRONT
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mssql-data:
