services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spa_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env local}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    build:
      context: ../Backend_API
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=${MSSQL_DATABASE:-FormDB};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env local};TrustServerCertificate=True;Encrypt=False
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no arquivo .env local}
      - Jwt__Issuer=${JWT_ISSUER:-form-api}
      - Jwt__Audience=${JWT_AUDIENCE:-form-client}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-120}
    volumes:
      - ../Backend_API/logs:/app/logs
    ports:
      - "5000:80"

  front:
    build:
      context: ../ESCOLA_FRONT
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mssql-data:
