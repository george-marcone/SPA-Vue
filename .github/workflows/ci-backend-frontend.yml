name: CI - Backend + Frontend

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Backend_API/**'
      - 'ESCOLA_FRONT/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend_API/**'
      - 'ESCOLA_FRONT/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Backend_API/form_API.Tests/form_API.Tests.csproj

      - name: Build backend
        run: dotnet build Backend_API/form_API.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Backend_API/form_API.Tests/form_API.Tests.csproj --configuration Release --no-restore

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ESCOLA_FRONT

      - name: Build frontend
        run: npm run build
        working-directory: ESCOLA_FRONT

      - name: Generate static frontend
        run: npm run generate
        working-directory: ESCOLA_FRONT

      - name: Run frontend tests
        run: npm test
        working-directory: ESCOLA_FRONT
