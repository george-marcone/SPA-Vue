name: Frontend - CI/CD GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'project_form/**'
      - '.github/workflows/frontend-pages.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'project_form/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-frontend
  cancel-in-progress: true

jobs:
  front-ci:
    name: Build and test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project_form/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: project_form

      - name: Run unit tests
        run: npm test
        working-directory: project_form

      - name: Generate static app
        run: npm run generate
        working-directory: project_form
        env:
          NUXT_APP_BASE_URL: ${{ format('/{0}/', github.event.repository.name) }}
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE || secrets.NUXT_PUBLIC_API_BASE || 'http://localhost:5001/api' }}

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: project_form/.output/public

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: front-ci
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
